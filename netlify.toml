# Manual CLI deploys of the deeplink generator:
#   npx netlify-cli deploy --dir=deploy --prod
#
# The static site lives in deploy/ (generated by build-hotel-index.py and
# git-ignored). Edge functions cannot ride along in a drag-and-drop deploy,
# which is why this is deployed from the CLI.

[build]
  publish = "deploy"
  edge_functions = "netlify/edge-functions"
